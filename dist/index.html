<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Filanwaa</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background-color: #0B3D2E;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    
    .card {
      background-color: #F5EDE0;
      border-radius: 16px;
      padding: 60px 80px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      max-width: 500px;
    }
    
    h1 {
      color: #0B3D2E;
      font-size: 3.5rem;
      margin-bottom: 10px;
    }
    
    .gold {
      color: #D4A537;
    }
    
    p {
      color: #12211B;
      font-size: 1.2rem;
      margin-bottom: 8px;
    }
    
    .sub {
      color: #4A554E;
      font-size: 0.95rem;
      margin-bottom: 25px;
    }
    
    .btn {
      display: inline-block;
      padding: 14px 40px;
      background-color: #D4A537;
      color: #06251C;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    
    .btn:hover {
      background-color: #E8C468;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1><span class="gold">ف</span>ilanwaa</h1>
    <p>Diinta · Tecnolijiyada · Suugaanta</p>
    <p class="sub">Soo dhawoow Filanwaa</p>
    <a href="#" class="btn">Bilow</a>
  </div>
</body>
</html>
